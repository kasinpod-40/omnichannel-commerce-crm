name: Validate TH-52

on:
  push:
    branches:
      - hotfix/enable-live-pc-low-stock-th-52
  pull_request:
    branches:
      - release/demo-shop-shopee-notification-th-51

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run full validation gate
        run: npm run check
